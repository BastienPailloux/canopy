name: release

on:
  push:
    branches: [master]

# Two close pushes must never release in parallel, and a running release is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The token is not left in .git/config for later steps (npm install scripts included).
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # No secret in the environment here: install scripts must never see them.
      - run: npm ci

      - id: next
        run: node scripts/release/cli.ts

      - name: Typecheck
        if: steps.next.outputs.version != ''
        run: npm run typecheck

      - name: Unit tests
        if: steps.next.outputs.version != ''
        run: npm test

      - name: Inject version
        if: steps.next.outputs.version != ''
        run: npm version "$V" --no-git-tag-version
        env:
          V: ${{ steps.next.outputs.version }}

      - name: Build
        if: steps.next.outputs.version != ''
        run: npm run build

      - name: Write App Store Connect API key
        if: steps.next.outputs.version != ''
        run: printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}

      # Secrets are exposed to this step only.
      - name: Package, sign and notarize
        if: steps.next.outputs.version != ''
        run: npx electron-builder --mac --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify Gatekeeper and staple
        if: steps.next.outputs.version != ''
        run: |
          spctl -a -vv dist/mac-arm64/Canopy.app
          xcrun stapler validate dist/mac-arm64/Canopy.app

      # The signature covers every nested binary, and the bundled claude still runs once unpacked.
      - name: Smoke test the app
        if: steps.next.outputs.version != ''
        run: |
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/Canopy.app
          dist/mac-arm64/Canopy.app/Contents/Resources/app.asar.unpacked/node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/claude --version

      - name: Create tag and release
        if: steps.next.outputs.version != ''
        run: |
          gh release create "v$V" --target "$GITHUB_SHA" --title "v$V" --notes-file dist-notes/notes.md \
            dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml
        env:
          V: ${{ steps.next.outputs.version }}
          GH_TOKEN: ${{ github.token }}
