name: ci

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

# A new push on a PR cancels its previous run. On develop and master a started run always
# finishes; a run still queued behind it is replaced by the newest push (GitHub keeps one pending).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No secret and a read-only token: fork PRs run the same jobs safely.
permissions:
  contents: read

jobs:
  checks:
    name: typecheck, tests, build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Each test launches its own Electron app with one worker: spread over runners, not workers.
  e2e-shard:
    name: e2e ${{ matrix.shard }}/3
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # Single stable check name for the ruleset, whatever the number of shards.
  e2e:
    name: e2e
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.e2e-shard.result }}

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Only what ships in the app; dev tooling advisories are left to Dependabot.
      - run: npm audit --omit=dev --audit-level=high
